# V1 model training configuration
# See MODEL_TRAINING_PLAN.md

paths:
  csv_input_glob: dataset/csv/processed_*.csv
  processed: data/processed
  models: ml_models
  reports: reports
  target_mapping: configs/target_mapping.yaml

# Seasons to load (null = discover all processed_*.csv in dataset/csv/)
inputs:
  seasons: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

splits:
  mode: temporal
  train_seasons: [2019, 2020, 2021, 2022, 2023]
  validation_season: 2024
  test_season: [2025, 2026]

model:
  objective: multi:softprob
  num_class: 3
  eval_metric: mlogloss
  max_depth: 4
  learning_rate: 0.05
  n_estimators: 500
  early_stopping_rounds: 30
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42

class_imbalance:
  strategy: inverse_frequency

evaluation:
  primary_metric: macro_f1
  min_macro_f1: 0.40
  min_improvement_over_baseline: 0.10

random_state: 42
